<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Westminster Historical Walk: Power, People & Topography (1485–1603)</title>
  
  <!-- Accessibility Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/opendyslexic@1.0.3/open-dyslexic.css">

  <style>
    :root {
      --bg-cream: #FAF0E6;
      --card-bg: #FFFFFF;
      --text-main: #242424;
      --text-muted: #555555;
      --navy: #1B365D;
      --crimson: #8B1E1E;
      --gold: #C5A059;
      --gold-light: #FDF8EE;
      --border: #DDCFC0;
      --border-focus: #1B365D;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --font-current: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --line-height-current: 1.65;
      --letter-spacing-current: 0.015em;
      --word-spacing-current: normal;
    }

    body.font-system {
      --font-current: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body.font-atkinson {
      --font-current: 'Atkinson Hyperlegible', 'Lexend', sans-serif;
    }
    body.font-dyslexic {
      --font-current: 'OpenDyslexic', 'Atkinson Hyperlegible', sans-serif;
    }

    body.spacing-standard {
      --line-height-current: 1.65;
      --letter-spacing-current: 0.015em;
      --word-spacing-current: normal;
    }
    body.spacing-spacious {
      --line-height-current: 1.85;
      --letter-spacing-current: 0.05em;
      --word-spacing-current: 0.12em;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      font-family: var(--font-current);
      font-size: 16px;
      line-height: var(--line-height-current);
      letter-spacing: var(--letter-spacing-current);
      word-spacing: var(--word-spacing-current);
      padding-top: 60px;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    /* Fixed Top Navigation Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--navy);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .top-bar-left {
      display: flex;
      flex-direction: column;
      max-width: 60%;
    }

    .top-bar-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-bar-progress {
      font-size: 0.78rem;
      color: var(--gold);
      font-weight: 600;
    }

    .header-btn {
      background: none;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 36px;
    }

    /* Main Container */
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .stop-header {
      margin-bottom: 16px;
      border-bottom: 2px solid var(--crimson);
      padding-bottom: 12px;
    }

    .stop-badge {
      display: inline-block;
      background: var(--crimson);
      color: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .stop-title {
      font-size: 1.35rem;
      color: var(--navy);
      line-height: 1.3;
      margin-bottom: 10px;
    }

    /* Progress & Walking Navigation Bar */
    .nav-anchor-bar {
      background: #F4ECE1;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-metric {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--navy);
    }

    .map-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--navy);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }

    .map-link-btn:hover {
      background: var(--crimson);
    }

    /* Image Gallery */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 18px 0;
    }

    .image-wrapper {
      position: relative;
      background: #ECE5DC;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 480px;
      object-fit: contain;
      background: #2E2E2E;
    }

    .image-caption {
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 8px 12px;
      background: #F8F5F0;
      border-top: 1px solid var(--border);
      font-style: italic;
    }

    /* Key Concept Box */
    .concept-box {
      background: var(--gold-light);
      border-left: 4px solid var(--gold);
      padding: 14px 16px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 20px;
    }

    .concept-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .concept-desc {
      font-size: 0.95rem;
      color: var(--text-main);
    }

    /* Historical Notes */
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--crimson);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notes-list {
      list-style-type: none;
      margin-bottom: 20px;
    }

    .notes-list li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 10px;
      font-size: 0.98rem;
    }

    .notes-list li::before {
      content: "■";
      position: absolute;
      left: 0;
      color: var(--crimson);
      font-size: 0.75rem;
      top: 5px;
    }

    /* Glossary Popover Links */
    .glossary-term {
      border-bottom: 2px dotted var(--navy);
      color: var(--navy);
      font-weight: 600;
      cursor: pointer;
      background-color: rgba(27, 54, 93, 0.07);
      padding: 1px 4px;
      border-radius: 3px;
      transition: background-color 0.15s ease;
    }

    .glossary-term:hover, .glossary-term:active {
      background-color: rgba(197, 160, 89, 0.35);
    }

    /* Floating Glossary Popover Modal */
    .glossary-popover {
      display: none;
      position: fixed;
      bottom: 74px;
      left: 16px;
      right: 16px;
      max-width: 520px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 2px solid var(--navy);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      padding: 16px;
      z-index: 2500;
      animation: popSlideUp 0.2s ease-out;
    }

    .glossary-popover.active {
      display: block;
    }

    @keyframes popSlideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .glossary-popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .glossary-popover-term {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--crimson);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .glossary-popover-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0 4px;
    }

    .glossary-popover-def {
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Accordions */
    details {
      background: #FAF7F2;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: background-color 0.2s ease;
    }

    details[open] {
      background: #FFFFFF;
    }

    summary {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--navy);
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "+";
      font-size: 1.3rem;
      color: var(--crimson);
      line-height: 1;
    }

    details[open] summary::after {
      content: "−";
    }

    .accordion-content {
      padding: 12px 16px 16px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.92rem;
    }

    .accordion-content ul {
      list-style-type: disc;
      padding-left: 18px;
    }

    .accordion-content li {
      margin-bottom: 8px;
    }

    /* Debate Box */
    .debate-box {
      background: #EEF4FA;
      border-left: 4px solid var(--navy);
      padding: 14px 16px;
      border-radius: 0 6px 6px 0;
      margin: 20px 0;
    }

    .debate-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--navy);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Scribe Interactive Note-Taking & Audio Dictation */
    .scribe-box {
      margin-top: 20px;
      background: #FDFBF7;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
    }

    .scribe-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .scribe-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scribe-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--crimson);
      text-transform: uppercase;
    }

    .dictate-btn {
      background: #FFFFFF;
      border: 1px solid var(--navy);
      color: var(--navy);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .dictate-btn.recording {
      background: var(--crimson);
      border-color: var(--crimson);
      color: #FFFFFF;
      animation: pulseRecord 1.4s infinite;
    }

    @keyframes pulseRecord {
      0% { box-shadow: 0 0 0 0 rgba(139, 30, 30, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(139, 30, 30, 0); }
      100% { box-shadow: 0 0 0 0 rgba(139, 30, 30, 0); }
    }

    .scribe-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      font-family: var(--font-current);
      font-size: 0.95rem;
      line-height: var(--line-height-current);
      letter-spacing: var(--letter-spacing-current);
      word-spacing: var(--word-spacing-current);
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #FFFFFF;
      color: var(--text-main);
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(27, 54, 93, 0.15);
    }

    /* Bottom Fixed Navigation Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 1000;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
    }

    .nav-btn {
      background: #FFFFFF;
      color: var(--navy);
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--gold-light);
    }

    .nav-btn:disabled {
      background: #A0AAB8;
      color: #6C757D;
      cursor: not-allowed;
    }

    .nav-btn-finish {
      background: var(--gold);
      color: #111111;
    }

    /* Slide-out Drawer */
    .drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 88%;
      max-width: 380px;
      height: 100%;
      background: var(--card-bg);
      box-shadow: -4px 0 16px rgba(0,0,0,0.25);
      z-index: 2000;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      background: var(--navy);
      color: #FFFFFF;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .close-btn {
      background: none;
      border: none;
      color: #FFFFFF;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .accessibility-card {
      background: var(--gold-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .accessibility-card-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--navy);
      margin-bottom: 10px;
    }

    .control-row {
      margin-bottom: 10px;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    .control-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    .control-select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      font-size: 0.88rem;
      color: var(--text-main);
      font-family: inherit;
    }
